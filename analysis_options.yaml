include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120
  trailing_commas: preserve

analyzer:
  exclude:
    - cargokit/**
    - build/**
    - windows/**
    - macos/**
    - linux/**
    - android/**
    - ios/**

