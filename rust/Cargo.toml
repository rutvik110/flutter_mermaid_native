[package]
name = "flutter_mermaid_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
merman = { version = "0.4", features = ["raster"] }
merman-core = "0.4"
resvg = "0.46"
usvg = "0.46"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
