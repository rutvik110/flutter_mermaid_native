name: flutter_mermaid_example
description: Demonstrates native Mermaid rendering with flutter_mermaid_native.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_mermaid_native:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
