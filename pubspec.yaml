name: flutter_mermaid_native
description: >-
  Render Mermaid diagrams in Flutter with a native Rust engine (merman).
  No WebView. Supports flowcharts, sequence, class, state, ER, Gantt, pie, git, and more.
version: 0.1.0
homepage: https://github.com/rutvik110/flutter_mermaid_native
repository: https://github.com/rutvik110/flutter_mermaid_native
issue_tracker: https://github.com/rutvik110/flutter_mermaid_native/issues
documentation: https://github.com/rutvik110/flutter_mermaid_native#readme

topics:
  - mermaid
  - diagrams
  - rust
  - ffi
  - widget

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # Must match the flutter_rust_bridge_codegen version that generated lib/src/rust.
  flutter_rust_bridge: 2.11.1
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
