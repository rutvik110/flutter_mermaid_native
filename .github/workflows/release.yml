name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test
        continue-on-error: true

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION} (tag: ${TAG})"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Extract package info
        id: package_info
        run: |
          NAME=$(grep '^name:' pubspec.yaml | sed 's/name: //')
          DESCRIPTION=$(grep '^description:' pubspec.yaml | sed 's/description: //' | sed 's/"//g')
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "description=${DESCRIPTION}" >> $GITHUB_OUTPUT

      - name: Create release package
        run: |
          mkdir -p release
          # Create a clean package excluding build artifacts
          tar --exclude='build' \
              --exclude='.dart_tool' \
              --exclude='.idea' \
              --exclude='.vscode' \
              --exclude='*.iml' \
              --exclude='example/build' \
              --exclude='example/.dart_tool' \
              --exclude='rust/target' \
              --exclude='.github' \
              -czvf release/${{ steps.package_info.outputs.name }}-${{ steps.version.outputs.version }}.tar.gz .

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag (or all commits if first release)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Write to file for multi-line output
          echo "## Changes" > CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          if [ -z "$COMMITS" ]; then
            echo "- Initial release" >> CHANGELOG_BODY.md
          else
            echo "$COMMITS" >> CHANGELOG_BODY.md
          fi
          echo "" >> CHANGELOG_BODY.md
          echo "## Installation" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "Add to your \`pubspec.yaml\`:" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "\`\`\`yaml" >> CHANGELOG_BODY.md
          echo "dependencies:" >> CHANGELOG_BODY.md
          echo "  ${{ steps.package_info.outputs.name }}:" >> CHANGELOG_BODY.md
          echo "    git:" >> CHANGELOG_BODY.md
          echo "      url: https://github.com/\${{ github.repository }}.git" >> CHANGELOG_BODY.md
          echo "      ref: ${{ steps.version.outputs.tag }}" >> CHANGELOG_BODY.md
          echo "\`\`\`" >> CHANGELOG_BODY.md

      - name: Create tag (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.version }}"
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.package_info.outputs.name }} v${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release/${{ steps.package_info.outputs.name }}-${{ steps.version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

